# Ba khối triển khai + Postgres (pgvector). Chạy: docker compose up -d --build
# Lần đầu: cp .env.example .env và điền TELEGRAM_BOT_TOKEN, ADMIN_TELEGRAM_IDS, OWNER_TELEGRAM_ID, LLM_API_KEY (9router), SECRETS_KEY.
x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgres://support:${POSTGRES_PASSWORD:-support}@db:5432/support
    MEDIA_DIR: /app/data/media
    # vault Obsidian + tệp thô admin tải lên (docs/adr/0005): admin ghi raw-data, worker ghi vault; bot chỉ đọc DB
    VAULT_DIR: /app/data/vault
    RAW_DATA_DIR: /app/data/raw-data
  # 9router chạy trên máy chủ (cổng 20128): container gọi qua host.docker.internal (Docker Desktop tự có; trên Linux nhờ dòng extra_hosts này).
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    db:
      condition: service_healthy
    embedding:
      condition: service_started # chỉ đảm bảo thứ tự khởi động; embedding chậm/lỗi thì bot vẫn chạy (tầng 0-1 bằng từ khoá), sau đó tự nạp lại vector
  restart: unless-stopped
  volumes:
    - media:/app/data/media
    - vault:/app/data/vault
    - raw-data:/app/data/raw-data

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support}
      POSTGRES_DB: support
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # Chỉ mở trên loopback (127.0.0.1:5433) để chạy `npm run dev:*` ngoài Docker; không ra mạng ngoài. 5433 để không đụng Postgres khác trên máy (5432).
    ports: ["127.0.0.1:5433:5432"]

  # Embedding đa ngôn ngữ tự host: BAAI/bge-m3 (1024 chiều, 100+ ngôn ngữ) qua Text Embeddings Inference, API tương thích OpenAI (/v1/embeddings).
  # Lần đầu tải ~2,3 GB model vào volume embedding-models. Cổng chỉ mở trên loopback (127.0.0.1) để chạy bot/bench ngoài Docker; không ra mạng ngoài.
  # Đổi model => đổi cả EMBEDDING_HF_MODEL và EMBEDDING_MODEL trong .env, rồi chạy lại bộ eval để hiệu chỉnh ngưỡng (docs/de_xuat_kien_truc_moi.md mục 4.3).
  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command: ["--model-id", "${EMBEDDING_HF_MODEL:-BAAI/bge-m3}", "--served-model-name", "${EMBEDDING_MODEL:-bge-m3}", "--max-client-batch-size", "32"]
    ports: ["127.0.0.1:8081:80"]
    volumes:
      - embedding-models:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s
    restart: unless-stopped

  bot:
    <<: *app
    command: ["node", "dist/bot.js"]
    ports: ["3000:3000"] # webhook Telegram: đặt sau reverse proxy HTTPS
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  admin:
    <<: *app
    command: ["node", "dist/admin.js"]
    ports: ["3001:3001"] # đặt sau reverse proxy HTTPS; đặt COOKIE_SECURE=true và TRUST_PROXY=true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    # Đúng 1 replica: các job đụng vào vault (vault-ingest/vault-index/vault-decide) ghi _meta/index.json bằng cách đọc cả
    # file, sửa trong bộ nhớ rồi ghi đè (src/vault/store.ts), không có khoá/gộp giữa các tiến trình. Chạy ≥2 worker song
    # song có thể làm một job ghi đè mất kết quả của job kia. Muốn scale worker thì phải thêm khoá (vd advisory lock theo
    # vault) trước.

volumes:
  pgdata:
  media:
  vault:
  raw-data:
  embedding-models:
