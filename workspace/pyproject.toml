[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "interlink-support-python"
version = "0.1.0"
description = "Python control-plane migration for InterLink support bot knowledge governance and RAG"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.118,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
  "uvicorn[standard]>=0.37,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.13,<1",
]

[project.scripts]
interlink-python-api = "interlink_support.api:run"
interlink-python-migrate = "interlink_support.migrate:main"
interlink-knowledge-worker = "interlink_support.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["python_app/interlink_support"]

[tool.pytest.ini_options]
pythonpath = ["python_app"]
testpaths = ["python_tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
